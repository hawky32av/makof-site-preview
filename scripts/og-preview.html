<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;
      --text:#171717;
      --muted:#6d6d6d;
      --line:#e6e6e6;
      --line-strong:#cccccc;
      --accent:#e86819;
      --portrait-bg:#f6f1eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
    body{
      color:var(--text);
      font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .frame{position:relative;width:1200px;height:630px;background:#fff;overflow:hidden}
    .copy{position:absolute;left:72px;top:76px;width:690px;z-index:2}
    .eyebrow{display:block;margin:0 0 18px;color:var(--accent);font-size:13px;font-weight:600;line-height:1.25}
    h1{max-width:690px;margin:0;font-size:78px;line-height:.98;letter-spacing:-.055em;font-weight:600;text-wrap:balance}
    h1 span{color:var(--accent)}
    .lead{max-width:610px;margin:28px 0 0;color:#494949;font-size:21px;line-height:1.55;font-weight:400}
    .brand{position:absolute;left:72px;bottom:52px;display:grid;gap:2px;padding-top:16px;border-top:1px solid var(--line-strong);width:650px}
    .brand strong{font-size:15px;font-weight:600;line-height:1.3}
    .brand span{font-size:12px;line-height:1.3;color:var(--muted)}

    .portrait{position:absolute;right:-20px;bottom:0;width:500px;height:610px;isolation:isolate}
    .portrait::before{content:"";position:absolute;z-index:-1;left:34%;right:0;top:5%;bottom:0;background:var(--portrait-bg)}
    .portrait img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:590px;width:auto;max-width:none;display:block}
  </style>
</head>
<body>
  <main class="frame">
    <section class="copy">
      <span class="eyebrow">ЕГЭ по информатике · 10–11 класс</span>
      <h1>Подготовка к ЕГЭ по информатике <span>от базы до 80+ баллов</span></h1>
      <p class="lead">Учимся решать задачи самостоятельно. Python можно начать с нуля.</p>
    </section>

    <div class="brand">
      <strong>Дмитрий Маков</strong>
      <span>преподаватель информатики · makof.ru</span>
    </div>

    <div class="portrait">
      <img src="../assets/about/about.png" alt="">
    </div>
  </main>
</body>
</html>
