<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#ffffff;
      --surface:#fafafa;
      --text:#171717;
      --muted:#6d6d6d;
      --line:#e6e6e6;
      --line-strong:#cccccc;
      --accent:#e86819;
      --photo-bg:#f4eee7;
      --photo-line:#eadfd4;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
    body{
      color:var(--text);
      font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .frame{position:relative;width:1200px;height:630px;padding:54px 68px 0;overflow:hidden;background:#fff}
    .frame::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--accent)}
    .brand{display:grid;gap:1px;position:absolute;left:68px;top:46px}
    .brand strong{font-size:15px;font-weight:600;line-height:1.3}
    .brand span{font-size:12px;line-height:1.3;color:var(--muted)}
    .content{position:absolute;left:68px;top:142px;width:665px}
    .eyebrow{display:block;margin:0 0 18px;color:var(--accent);font-size:13px;font-weight:600;line-height:1.25}
    h1{max-width:665px;margin:0;font-size:72px;line-height:.98;letter-spacing:-.055em;font-weight:600;text-wrap:balance}
    h1 span{color:var(--accent)}
    .lead{max-width:620px;margin:26px 0 0;color:#494949;font-size:20px;line-height:1.55;font-weight:400}
    .proof{position:absolute;left:68px;bottom:38px;width:665px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-strong)}
    .proof-item{min-height:82px;padding:17px 18px;border-right:1px solid var(--line);display:grid;align-content:center;gap:3px}
    .proof-item:first-child{padding-left:0}
    .proof-item:last-child{border-right:0}
    .proof-item strong{font-size:20px;line-height:1.15;font-weight:600;letter-spacing:-.025em}
    .proof-item span{color:var(--muted);font-size:12px;line-height:1.35}
    .photo-wrap{position:absolute;right:68px;bottom:10px;width:382px;height:568px;background:var(--photo-bg);border:1px solid var(--photo-line);overflow:hidden}
    .photo-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--accent)}
    .photo{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:540px;width:auto;max-width:none;display:block}
    .site{position:absolute;right:20px;top:20px;padding:9px 12px;background:rgba(255,255,255,.92);border:1px solid var(--photo-line);font-size:12px;font-weight:600;line-height:1;color:var(--text)}
  </style>
</head>
<body>
  <main class="frame">
    <div class="brand"><strong>Дмитрий Маков</strong><span>преподаватель информатики</span></div>

    <section class="content">
      <span class="eyebrow">ЕГЭ по информатике · 10–11 класс</span>
      <h1>Подготовка к ЕГЭ по информатике <span>от базы до 80+ баллов</span></h1>
      <p class="lead">Python с нуля, практика по темам и бесплатное пробное занятие.</p>
    </section>

    <div class="proof" aria-hidden="true">
      <div class="proof-item"><strong>81 балл</strong><span>средний результат</span></div>
      <div class="proof-item"><strong>100 баллов</strong><span>лучший результат</span></div>
      <div class="proof-item"><strong>с 2019 года</strong><span>готовлю к экзаменам</span></div>
    </div>

    <div class="photo-wrap">
      <span class="site">makof.ru</span>
      <img class="photo" src="../assets/about/about.png" alt="">
    </div>
  </main>
</body>
</html>
