name: Refresh OG v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-og-v2.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch OG to a fresh URL
        run: |
          sed -i 's#og-preview.jpg#og-preview-v2.jpg#g' index.html scripts/update_galleries.py scripts/build_og_preview.mjs .github/workflows/update-galleries.yml

      - name: Install browser renderer
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Build fresh OG preview
        run: node scripts/build_og_preview.mjs

      - name: Commit fresh preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/update_galleries.py scripts/build_og_preview.mjs .github/workflows/update-galleries.yml assets/og/og-preview-v2.jpg
          git commit -m "Refresh OG preview at uncached URL"
          git pull --rebase origin main
          git push
