name: One-off swipe carousel patch

on:
  push:
    paths:
      - .github/workflows/oneoff-swipe-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: python scripts/patch_swipe.py
      - name: Commit result and remove one-off files
        run: |
          rm .github/workflows/oneoff-swipe-patch.yml scripts/patch_swipe.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/oneoff-swipe-patch.yml scripts/patch_swipe.py
          git commit -m "Use swipe-only image carousels"
          git push
