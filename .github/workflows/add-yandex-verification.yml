name: Add Yandex Webmaster verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-yandex-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add verification meta
        run: |
          python - <<'PY'
          from pathlib import Path

          tag = '  <meta name="yandex-verification" content="a87080eaedd76cc9">\n'
          anchor = '  <meta name="theme-color" content="#e86819">\n'

          for filename in ("index.html", "scripts/update_galleries.py"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if 'name="yandex-verification"' in text:
                  print(f"{filename}: already present")
                  continue
              if anchor not in text:
                  raise SystemExit(f"Anchor not found in {filename}")
              text = text.replace(anchor, anchor + tag, 1)
              path.write_text(text, encoding="utf-8")
              print(f"{filename}: added")
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html scripts/update_galleries.py; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/update_galleries.py
          git commit -m "Add Yandex Webmaster verification"
          git pull --rebase origin main
          git push
