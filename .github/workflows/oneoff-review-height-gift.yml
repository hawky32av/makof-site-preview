name: One-off review height and gift patch

on:
  push:
    paths:
      - .github/workflows/oneoff-review-height-gift.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch-review-height-gift.py
      - name: Commit result and remove one-off files
        run: |
          rm .github/workflows/oneoff-review-height-gift.yml scripts/patch-review-height-gift.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/oneoff-review-height-gift.yml scripts/patch-review-height-gift.py
          git commit -m "Fix desktop review height and split trial gift"
          git push
