name: Apply legal site patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/legal_patch.py'
      - '.github/workflows/apply-legal-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/legal_patch.py
