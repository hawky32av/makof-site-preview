name: Final site audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-site-audit.yml"
      - "scripts/final_site_audit.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run audit
        run: python scripts/final_site_audit.py
