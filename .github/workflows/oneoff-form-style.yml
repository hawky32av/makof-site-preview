name: One-off form style patch
on:
  push:
    paths:
      - '.github/workflows/oneoff-form-style.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/patches/form-style.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patches/form-style.py .github/workflows/oneoff-form-style.yml
          git add index.html
          git commit -m "Match signup form to site accent"
          git push
