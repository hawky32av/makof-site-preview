name: One-off AlfaCRM CSS patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-alfa-css.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python patch_alfa_css.py
      - run: |
          rm patch_alfa_css.py
          rm .github/workflows/oneoff-alfa-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html patch_alfa_css.py .github/workflows/oneoff-alfa-css.yml
          git commit -m "Use custom AlfaCRM form theme"
          git push
