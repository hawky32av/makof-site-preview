name: One-off desktop carousel patch

on:
  push:
    paths:
      - .github/workflows/oneoff-desktop-carousel-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch desktop carousel behavior
        run: python .github/scripts/desktop_carousel_patch.py
      - name: Commit patched page and cleanup
        run: |
          rm .github/scripts/desktop_carousel_patch.py
          rm .github/workflows/oneoff-desktop-carousel-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/desktop_carousel_patch.py .github/workflows/oneoff-desktop-carousel-patch.yml
          git commit -m "Use desktop controls for image carousels"
          git push
