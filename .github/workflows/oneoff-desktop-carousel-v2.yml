name: One-off desktop carousel v2

on:
  push:
    paths:
      - .github/workflows/oneoff-desktop-carousel-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch desktop carousel behavior
        run: python .github/patch_desktop_carousel_v2.py
      - name: Commit patched page and clean up
        run: |
          rm .github/patch_desktop_carousel_v2.py
          rm .github/workflows/oneoff-desktop-carousel-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/patch_desktop_carousel_v2.py .github/workflows/oneoff-desktop-carousel-v2.yml
          git commit -m "Rebuild desktop image carousels"
          git push
