name: Inspect AlfaCRM JS
on:
  push:
    paths:
      - '.github/workflows/inspect-alfa-js.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch lead form JS
        run: |
          python - <<'PY'
          import urllib.request
          url='https://cdn.alfacrm.pro/lead-form/lead-form-v1.0.0.js'
          data=urllib.request.urlopen(url, timeout=20).read().decode('utf-8','replace')
          open('alfa-lead-form.js','w',encoding='utf-8').write(data)
          PY
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alfa-lead-form.js
          git commit -m 'Inspect AlfaCRM lead form script' || exit 0
          git push
