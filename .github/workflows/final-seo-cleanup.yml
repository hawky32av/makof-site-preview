name: Final SEO cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-seo-cleanup.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply SEO cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          old_desc = 'Подготовка к ЕГЭ по информатике для 10–11 классов. Дмитрий Маков: профильное образование ИТМО, подготовка экспертов предметной комиссии, автор учебника по Python, подтверждённые результаты учеников и бесплатное пробное занятие.'
          new_desc = 'Подготовка к ЕГЭ по информатике для 10–11 классов. Python с нуля, подтверждённые результаты учеников, бесплатное пробное занятие.'

          website_node = '''      {
        "@type": "WebSite",
        "@id": "https://makof.ru/#website",
        "url": "https://makof.ru/",
        "name": "Дмитрий Маков",
        "alternateName": "Подготовка к ЕГЭ по информатике — Дмитрий Маков",
        "inLanguage": "ru-RU"
      },
'''

          person_anchor = '''      {
        "@type": "Person",
        "@id": "https://makof.ru/#person",'''

          for filename in ("index.html", "scripts/update_galleries.py"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if old_desc in text:
                  text = text.replace(old_desc, new_desc)
              if '"@type": "WebSite"' not in text:
                  if person_anchor not in text:
                      raise SystemExit(f"Person schema anchor missing in {filename}")
                  text = text.replace(person_anchor, website_node + person_anchor, 1)
              path.write_text(text, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          old_hero = '<img src="assets/hero/hero.png" alt="Дмитрий Маков с учебником">'
          new_hero = '<img src="assets/hero/hero.png" alt="Дмитрий Маков с учебником" width="1086" height="1448" fetchpriority="high">'
          if old_hero in text:
              text = text.replace(old_hero, new_hero, 1)
          elif new_hero not in text:
              raise SystemExit("Hero image anchor missing")
          index.write_text(text, encoding="utf-8")
          PY

      - name: Validate SEO essentials
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('<h1') == 1, 'Expected exactly one H1'
          assert 'rel="canonical" href="https://makof.ru/"' in html
          assert 'name="robots" content="index,follow' in html
          assert 'name="yandex-verification" content="a87080eaedd76cc9"' in html
          assert 'https://makof.ru/assets/og/og-preview-v2.jpg' in html
          assert '"@type": "WebSite"' in html
          assert 'width="1086" height="1448" fetchpriority="high"' in html

          blocks = re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', html, re.S)
          assert blocks, 'No JSON-LD found'
          for block in blocks:
              json.loads(block)

          robots = Path('robots.txt').read_text(encoding='utf-8')
          assert 'Sitemap: https://makof.ru/sitemap.xml' in robots
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert '<loc>https://makof.ru/</loc>' in sitemap
          for legal in ('privacy.html','consent.html','offer.html','404.html'):
              txt = Path(legal).read_text(encoding='utf-8')
              assert 'noindex,follow' in txt
          print('SEO validation passed')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html scripts/update_galleries.py; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/update_galleries.py
          git commit -m "Polish final SEO metadata"
          git pull --rebase origin main
          git push
