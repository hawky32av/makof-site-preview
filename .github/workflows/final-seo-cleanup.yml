name: Final SEO cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-seo-cleanup.yml"
      - "scripts/final_seo_cleanup.py"

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply and validate SEO cleanup
        run: python scripts/final_seo_cleanup.py

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html scripts/update_galleries.py; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/update_galleries.py
          git commit -m "Polish final SEO metadata"
          git pull --rebase origin main
          git push
