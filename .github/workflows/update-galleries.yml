name: Update galleries

on:
  push:
    paths:
      - "assets/reviews/**"
      - "assets/achievements/**"
      - "favicon.svg"
      - "scripts/update_galleries.py"
      - ".github/workflows/update-galleries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update generated site content
        run: |
          python scripts/update_galleries.py
          python - <<'PY'
          from pathlib import Path

          old = '<link rel="icon" href="assets/hero/hero.png" type="image/png">'
          new = '<link rel="icon" href="favicon.svg" type="image/svg+xml">'
          for filename in ("index.html", "privacy.html", "consent.html", "offer.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html styles.css privacy.html consent.html offer.html; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css privacy.html consent.html offer.html
          git commit -m "Update generated site content"
          git pull --rebase origin main
          git push
