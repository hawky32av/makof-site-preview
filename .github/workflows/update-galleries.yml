name: Update generated site content

on:
  push:
    branches: [main]
    paths:
      - "assets/reviews/**"
      - "assets/achievements/**"
      - "assets/about/about.png"
      - "favicon.png"
      - "scripts/update_galleries.py"
      - "scripts/og-preview.html"
      - "scripts/build_og_preview.mjs"
      - ".github/workflows/update-galleries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update galleries and metadata
        run: python scripts/update_galleries.py

      - name: Install browser renderer
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Build Open Graph preview
        run: node scripts/build_og_preview.mjs

      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html styles.css privacy.html consent.html offer.html assets/og/og-preview-v2.jpg; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css privacy.html consent.html offer.html assets/og/og-preview-v2.jpg
          git commit -m "Update generated site content"
          git pull --rebase origin main
          git push
