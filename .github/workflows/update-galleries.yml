name: Update galleries

on:
  push:
    paths:
      - "assets/reviews/**"
      - "assets/achievements/**"
      - "scripts/update_galleries.py"
      - ".github/workflows/update-galleries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update gallery markup
        run: python scripts/update_galleries.py

      - name: Commit generated markup
        run: |
          if git diff --quiet -- index.html styles.css; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Update site galleries"
          git push
