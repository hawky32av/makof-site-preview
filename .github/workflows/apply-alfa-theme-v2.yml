name: Apply AlfaCRM theme v2
on:
  push:
    paths:
      - '.github/workflows/apply-alfa-theme-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust AlfaCRM CSS cache and clean inspection files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https%3A%2F%2Fhawky32av.github.io%2Fmakof-site-preview%2Falfa-form.css'
          new = 'https%3A%2F%2Fhawky32av.github.io%2Fmakof-site-preview%2Falfa-form.css%3Fv%3D2'
          if old not in s:
              raise SystemExit('Alfa CSS URL not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f alfa-inspect.html alfa-lead-form.js
          rm -f .github/workflows/inspect-alfa-form.yml .github/workflows/inspect-alfa-js.yml
          rm -f .github/workflows/apply-alfa-theme-v2.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply targeted AlfaCRM theme and clean inspection files' || exit 0
          git push
